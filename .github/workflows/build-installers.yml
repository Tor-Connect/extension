name: Build companion installers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TOR_EXTENSION_ID: ${{ vars.TOR_EXTENSION_ID || 'nhpflipfjhibgcopfbeoloeghdpoighk' }}

jobs:
  # Computes next version, bumps version constants, pushes tag + chore(release) commit.
  # Does NOT publish the GitHub release — that happens in the release job after all builds succeed.
  semantic-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}
      notes: ${{ steps.sr.outputs.new_release_notes }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish release from commit titles
        id: sr
        uses: cycjimmy/semantic-release-action@v7
        with:
          semantic_version: 25
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload Firefox extension package
        if: steps.sr.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Tor-Connect-Firefox-Extension
          path: dist/release/Tor-Connect-Firefox-Extension-*.zip
          if-no-files-found: error

  linux:
    needs: semantic-release
    # Run when semantic-release cut a new release, or on manual dispatch
    if: needs.semantic-release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch the chore(release) commit that semantic-release just pushed
          ref: main
      - name: Install package and signature tools
        run: sudo apt-get update && sudo apt-get install --yes dpkg-dev gnupg
      - name: Download and verify Tor bundle
        run: scripts/download-verified-tor-bundle.sh linux-x86_64 dist/tor-expert-bundle-linux-x86_64.tar.gz
      - name: Build Debian installer
        run: installer/linux/build-deb.sh "${{ env.TOR_EXTENSION_ID }}" dist/tor-expert-bundle-linux-x86_64.tar.gz dist
      - name: Download and verify Windows Tor bundle
        run: scripts/download-verified-tor-bundle.sh windows-x86_64 dist/tor-expert-bundle-windows-x86_64.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: Tor-Connect-Setup-Linux-x64
          path: dist/Tor-Connect-Setup-Linux-x64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: tor-expert-bundle-windows-x64
          path: dist/tor-expert-bundle-windows-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install GnuPG
        run: brew install gnupg
      - name: Download and verify Tor bundles
        shell: bash
        run: |
          scripts/download-verified-tor-bundle.sh macos-aarch64 dist/tor-expert-bundle-macos-arm64.tar.gz
          scripts/download-verified-tor-bundle.sh macos-x86_64 dist/tor-expert-bundle-macos-x86_64.tar.gz
      - name: Build universal Mac setup app
        run: scripts/build-macos-installer.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Tor-Connect-Setup-macOS
          path: dist/Tor-Connect-Setup-macOS.zip
          if-no-files-found: error

  windows:
    needs: [semantic-release, linux]
    if: needs.semantic-release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: tor-expert-bundle-windows-x64
          path: dist
          merge-multiple: true
      - name: Build Windows setup installer
        shell: pwsh
        run: |
          $archiveName = 'tor-expert-bundle-windows-x86_64.tar.gz'
          $archive = Get-ChildItem -LiteralPath dist -Filter $archiveName -File -Recurse | Select-Object -First 1
          if (-not $archive) {
            Get-ChildItem -LiteralPath dist -Recurse | Select-Object -ExpandProperty FullName
            throw "The verified Windows Tor bundle artifact '$archiveName' was not downloaded."
          }
          .\installer\windows\build-installer.ps1 -ExtensionId "${{ env.TOR_EXTENSION_ID }}" -BundleArchive $archive.FullName
          Copy-Item dist/windows-payload/tor-chrome-helper.exe dist/Tor-Connect-Helper-Windows-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: Tor-Connect-Setup-Windows-x64
          path: dist/Tor-Connect-Setup-Windows-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Tor-Connect-Helper-Windows-x64
          path: dist/Tor-Connect-Helper-Windows-x64.exe
          if-no-files-found: error

  release:
    needs: [semantic-release, macos, windows, linux]
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v8
        with:
          pattern: Tor-Connect-*
          path: dist/release
          merge-multiple: true
      - name: Create GitHub release and upload installer artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.semantic-release.outputs.version }}
          name: v${{ needs.semantic-release.outputs.version }}
          body: ${{ needs.semantic-release.outputs.notes }}
          files: dist/release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
