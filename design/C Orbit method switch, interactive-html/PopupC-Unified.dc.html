<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit, method switch</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes twinkle{0%,100%{opacity:0.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.spin,.flow,.tw{animation:none !important}}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 16px 20px 20px; background: #080C0B; color: #EAF1EE; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="display: flex; align-items: center; gap: 8px">
      <sc-if value="{{ glyphOff }}" hint-placeholder-val="{{ true }}">
        <svg viewBox="0 0 128 128" width="24" height="24" aria-hidden="true"><g fill="none" stroke="#7D868F" stroke-width="10" stroke-linecap="round"><path d="M20 88 H48"></path><path d="M80 88 H108"></path><path d="M20 88 A44 44 0 0 1 108 88" stroke-dasharray="54 30 54"></path><path d="M35 88 A29 29 0 0 1 93 88" stroke-dasharray="33.5 24 33.5"></path><path d="M50 88 A14 14 0 0 1 78 88" stroke-dasharray="14 16 14"></path></g></svg>
      </sc-if>
      <sc-if value="{{ isConn }}" hint-placeholder-val="{{ false }}">
        <svg viewBox="0 0 128 128" width="24" height="24" aria-hidden="true"><g fill="none" stroke="#2BD576" stroke-width="10" stroke-linecap="round"><path d="M20 88 H108" stroke-opacity="0.6"></path><path d="M20 88 A44 44 0 0 1 108 88" stroke-dasharray="30 12" stroke-opacity="0.6"></path><path d="M35 88 A29 29 0 0 1 93 88"></path><path d="M50 88 A14 14 0 0 1 78 88"></path></g></svg>
      </sc-if>
      <sc-if value="{{ isOn }}" hint-placeholder-val="{{ false }}">
        <svg viewBox="0 0 128 128" width="24" height="24" aria-hidden="true"><g fill="none" stroke="#2BD576" stroke-width="10" stroke-linecap="round"><path d="M20 88 H108"></path><path d="M20 88 A44 44 0 0 1 108 88"></path><path d="M35 88 A29 29 0 0 1 93 88"></path><path d="M50 88 A14 14 0 0 1 78 88"></path></g></svg>
      </sc-if>
      <span style="font-size: 14px; font-weight: 500; letter-spacing: 0.02em; color: #A9B3AE">Tor Connect</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Settings" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; border: 0; background: #121816; color: #A9B3AE">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
      </button>
      <button aria-label="Open in a full tab" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; border: 0; background: #121816; color: #A9B3AE">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"></path></svg>
      </button>
    </div>
  </div>

  <div aria-live="polite" style="margin-top: 10px; text-align: center">
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: {{ titleColor }}">{{ title }}</div>
    <div style="margin-top: 4px; font-size: 13px; color: #8A948F">
      <sc-if value="{{ isOn }}" hint-placeholder-val="{{ false }}">
        <span><span style="font-family: 'IBM Plex Mono', monospace; color: #A9B3AE">{{ time }}</span> · tap the center to disconnect</span>
      </sc-if>
      <sc-if value="{{ notOn }}" hint-placeholder-val="{{ true }}">
        <span>{{ sub }}</span>
      </sc-if>
    </div>
  </div>

  <div style="position: relative; width: 320px; height: 320px; margin: 4px auto 0">

    <sc-if value="{{ isOn }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <circle cx="160" cy="160" r="86" fill="#2BD576" fill-opacity="0.08"></circle>
        <circle cx="160" cy="160" r="122" fill="none" stroke="#1C5B3B" stroke-width="2"></circle>
      </svg>
    </sc-if>
    <sc-if value="{{ notOn }}" hint-placeholder-val="{{ true }}">
      <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <circle cx="160" cy="160" r="122" fill="none" stroke="#2A3430" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"></circle>
      </svg>
    </sc-if>
    <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <circle cx="160" cy="160" r="84" fill="none" stroke="#141B18" stroke-width="2"></circle>
    </svg>
    <sc-if value="{{ showSpokes }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <g stroke="#151C19" stroke-width="1.5">
          <path d="M160 160 L160 38"></path>
          <path d="M160 160 L265.7 221"></path>
          <path d="M160 160 L54.3 221"></path>
        </g>
      </svg>
    </sc-if>
    <sc-if value="{{ showLineOff }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <path d="{{ linePath }}" stroke="#4A5753" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" fill="none"></path>
      </svg>
    </sc-if>
    <sc-if value="{{ showLineLive }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <path class="flow" d="{{ linePath }}" stroke="#2BD576" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8" fill="none" style="animation: flow 1s linear infinite"></path>
      </svg>
    </sc-if>

    <sc-if value="{{ heroOff }}" hint-placeholder-val="{{ true }}">
      <button aria-label="Connect" onClick="{{ heroTap }}" style="position: absolute; left: 104px; top: 104px; width: 112px; height: 112px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #2A3230; background: #121816">
        <svg viewBox="0 0 128 128" width="64" height="64" aria-hidden="true"><g fill="none" stroke="#7D868F" stroke-width="9" stroke-linecap="round"><path d="M20 88 H48"></path><path d="M80 88 H108"></path><path d="M20 88 A44 44 0 0 1 108 88" stroke-dasharray="54 30 54"></path><path d="M35 88 A29 29 0 0 1 93 88" stroke-dasharray="33.5 24 33.5"></path><path d="M50 88 A14 14 0 0 1 78 88" stroke-dasharray="14 16 14"></path></g></svg>
      </button>
    </sc-if>
    <sc-if value="{{ heroEmpty }}" hint-placeholder-val="{{ false }}">
      <button aria-label="Add bridges in Settings" onClick="{{ goSettings }}" style="position: absolute; left: 104px; top: 104px; width: 112px; height: 112px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px dashed #2A3230; background: #0E1412">
        <svg viewBox="0 0 128 128" width="64" height="64" aria-hidden="true"><g fill="none" stroke="#4A5753" stroke-width="9" stroke-linecap="round"><path d="M20 88 H48"></path><path d="M80 88 H108"></path><path d="M20 88 A44 44 0 0 1 108 88" stroke-dasharray="54 30 54"></path><path d="M35 88 A29 29 0 0 1 93 88" stroke-dasharray="33.5 24 33.5"></path><path d="M50 88 A14 14 0 0 1 78 88" stroke-dasharray="14 16 14"></path></g></svg>
      </button>
    </sc-if>
    <sc-if value="{{ isConn }}" hint-placeholder-val="{{ false }}">
      <button aria-label="Cancel connecting" onClick="{{ heroTap }}" style="position: absolute; left: 104px; top: 104px; width: 112px; height: 112px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #1E3A2C; background: #12261C">
        <svg class="spin" viewBox="0 0 112 112" width="112" height="112" aria-hidden="true" style="position: absolute; left: -2px; top: -2px; animation: spin 1.6s linear infinite"><circle cx="56" cy="56" r="54" fill="none" stroke="#2BD576" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 270"></circle></svg>
        <svg viewBox="0 0 128 128" width="64" height="64" aria-hidden="true"><g fill="none" stroke="#2BD576" stroke-width="9" stroke-linecap="round"><path d="M20 88 H108" stroke-opacity="0.6"></path><path d="M20 88 A44 44 0 0 1 108 88" stroke-dasharray="30 12" stroke-opacity="0.6"></path><path d="M35 88 A29 29 0 0 1 93 88"></path><path d="M50 88 A14 14 0 0 1 78 88"></path></g></svg>
      </button>
    </sc-if>
    <sc-if value="{{ isOn }}" hint-placeholder-val="{{ false }}">
      <button aria-label="Disconnect" onClick="{{ heroTap }}" style="position: absolute; left: 104px; top: 104px; width: 112px; height: 112px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #2BD576; background: #10291C; box-shadow: 0 0 0 8px rgba(43, 213, 118, 0.08), 0 0 40px rgba(43, 213, 118, 0.3)">
        <svg viewBox="0 0 128 128" width="64" height="64" aria-hidden="true"><g fill="none" stroke="#2BD576" stroke-width="9" stroke-linecap="round"><path d="M20 88 H108"></path><path d="M20 88 A44 44 0 0 1 108 88"></path><path d="M35 88 A29 29 0 0 1 93 88"></path><path d="M50 88 A14 14 0 0 1 78 88"></path></g></svg>
      </button>
    </sc-if>

    <div role="radiogroup" aria-label="Connection method" style="position: absolute; left: 110px; top: 266px; width: 100px; height: 52px; box-sizing: border-box; border-radius: 26px; background: #0E1412; border: 1.5px solid #262D2B; box-shadow: 0 0 0 5px #080C0B">
      <span aria-hidden="true" style="position: absolute; top: 2px; left: {{ thumbLeft }}px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #10291C; border: 1.5px solid #2BD576; box-shadow: 0 0 14px rgba(43, 213, 118, 0.28); transition: left 0.25s cubic-bezier(0.3, 0.9, 0.3, 1)"></span>
      <button role="radio" aria-checked="{{ snowChecked }}" aria-label="Snowflake" title="Snowflake" onClick="{{ pickSnow }}" style="position: absolute; left: 3px; top: 2px; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: transparent; color: {{ segSnowFg }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"></path><path d="M9.5 4.8L12 7l2.5-2.2M9.5 19.2L12 17l2.5 2.2"></path></svg>
      </button>
      <button role="radio" aria-checked="{{ bridgeChecked }}" aria-label="Bridge lines" title="Bridge lines" onClick="{{ pickBridge }}" style="position: absolute; left: 50px; top: 2px; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: transparent; color: {{ segBridgeFg }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="6" r="1.4"></circle><circle cx="5" cy="12" r="1.4"></circle><circle cx="5" cy="18" r="1.4"></circle><path d="M10 6h10M10 12h10M10 18h6"></path></svg>
      </button>
    </div>

    <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="3">
      <div style="display: contents">
        <sc-if value="{{ n.pickable }}" hint-placeholder-val="{{ false }}">
          <button role="radio" aria-checked="{{ n.checked }}" aria-label="{{ n.aria }}" onClick="{{ n.pick }}" style="position: absolute; left: {{ n.left }}px; top: {{ n.top }}px; width: 48px; height: 48px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid {{ n.border }}; background: {{ n.bg }}; color: {{ n.fg }}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; box-shadow: {{ n.shadow }}">{{ n.cc }}</button>
        </sc-if>
        <sc-if value="{{ n.decor }}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="position: absolute; left: {{ n.left }}px; top: {{ n.top }}px; width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid {{ n.border }}; background: {{ n.bg }}; color: {{ n.fg }}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; box-shadow: {{ n.shadow }}">{{ n.cc }}</span>
        </sc-if>
        <sc-if value="{{ n.slot }}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="position: absolute; left: {{ n.left }}px; top: {{ n.top }}px; width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px dashed #2A3430; color: #3A4642">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          </span>
        </sc-if>
        <sc-if value="{{ n.flake }}" hint-placeholder-val="{{ true }}">
          <span class="tw" aria-hidden="true" style="position: absolute; left: {{ n.left }}px; top: {{ n.top }}px; width: 36px; height: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid {{ n.border }}; background: {{ n.bg }}; color: {{ n.fg }}; box-shadow: {{ n.shadow }}; animation: {{ n.anim }}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"></path><path d="M9.5 4.8L12 7l2.5-2.2M9.5 19.2L12 17l2.5 2.2"></path></svg>
          </span>
        </sc-if>
        <sc-if value="{{ n.hasLabel }}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="position: absolute; left: {{ n.lblLeft }}px; top: {{ n.lblTop }}px; width: 80px; text-align: center; font-size: 11px; font-weight: {{ n.lblWeight }}; color: {{ n.lblColor }}">{{ n.name }}</span>
        </sc-if>
      </div>
    </sc-for>

  </div>

  <sc-if value="{{ showSnowInfo }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; min-height: 76px">
      <div style="display: flex; align-items: center; gap: 8px; height: 28px">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="{{ infoIcon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"></path><path d="M9.5 4.8L12 7l2.5-2.2M9.5 19.2L12 17l2.5 2.2"></path></svg>
        <span style="font-size: 15px; font-weight: 600">Snowflake</span>
      </div>
      <div style="margin-top: 4px; font-size: 13px; line-height: 1.45; color: #8A948F">{{ info }}</div>
    </div>
  </sc-if>

  <sc-if value="{{ showBridgeInfo }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: auto">
      <div style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 28px">
        <span style="font-size: 15px; font-weight: 600">{{ infoName }}</span>
        <span style="margin-left: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A9B3AE">{{ infoAddr }}</span>
        <sc-if value="{{ isOn }}" hint-placeholder-val="{{ false }}">
          <button aria-label="Copy bridge address" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #A9B3AE">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8"></path></svg>
          </button>
        </sc-if>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; margin-top: 4px; border-top: 1px solid #1D2421">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 14px; font-weight: 500">Auto-select bridge</span>
          <span style="font-size: 12px; color: #8A948F">{{ autoSub }}</span>
        </div>
        <sc-if value="{{ autoOn }}" hint-placeholder-val="{{ false }}">
          <button role="switch" aria-checked="true" aria-label="Auto-select bridge" onClick="{{ toggleAuto }}" style="position: relative; flex: none; width: 44px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: #2BD576">
            <span style="position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 50%; background: #06150D"></span>
          </button>
        </sc-if>
        <sc-if value="{{ autoOff }}" hint-placeholder-val="{{ true }}">
          <button role="switch" aria-checked="false" aria-label="Auto-select bridge" onClick="{{ toggleAuto }}" style="position: relative; flex: none; width: 44px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: #2A3230">
            <span style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #8A948F"></span>
          </button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: auto">
      <div style="margin: 0 auto 12px; max-width: 290px; text-align: center; font-size: 13px; line-height: 1.45; color: #8A948F">Bridges are private Tor entry points. Request some from the Tor Project, then import them in Settings.</div>
      <button onClick="{{ goSettings }}" style="width: 100%; height: 52px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 26px; background: #2BD576; color: #06150D; font-size: 15px; font-weight: 600">
        Add bridges in Settings
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
      </button>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  getS() {
    const st = this.state || {};
    return {
      method: st.method || 'snow',
      status: st.status || 'off',
      auto: !!st.auto,
      sel: st.sel === undefined ? 1 : st.sel,
      seconds: st.seconds || 0,
      hasBridges: !!st.hasBridges
    };
  }

  componentDidMount() {
    this._tick = setInterval(() => {
      const st = this.getS();
      if (st.status === 'on') this.setState({ seconds: st.seconds + 1 });
    }, 1000);
  }

  componentWillUnmount() {
    clearInterval(this._tick);
    clearTimeout(this._conn);
  }

  setMethod(m) {
    clearTimeout(this._conn);
    if (this.getS().method === m) return;
    // Switching method always drops any live or pending connection.
    this.setState({ method: m, status: 'off', seconds: 0 });
  }

  goSettings() {
    // Prototype stand-in: the real button opens the Settings page on Bridge lines.
    // Here it behaves as if the user imported bridges and came back.
    clearTimeout(this._conn);
    this.setState({ hasBridges: true, method: 'bridge', status: 'off', seconds: 0 });
  }

  startConnect(sel) {
    clearTimeout(this._conn);
    const snow = this.getS().method === 'snow';
    this.setState({ status: 'connecting', sel: sel, seconds: 0 });
    this._conn = setTimeout(() => this.setState({ status: 'on', seconds: 0 }), snow ? 2200 : 1800);
  }

  heroTap() {
    const st = this.getS();
    if (st.method === 'bridge' && !st.hasBridges) {
      this.goSettings();
      return;
    }
    if (st.status === 'off') {
      this.startConnect(st.method === 'bridge' && st.auto ? 1 : st.sel);
    } else if (st.status === 'connecting') {
      clearTimeout(this._conn);
      this.setState({ status: 'off' });
    } else {
      this.setState({ status: 'off', seconds: 0 });
    }
  }

  toggleAuto() {
    this.setState({ auto: !this.getS().auto });
  }

  pick(i) {
    const st = this.getS();
    if (st.auto) return;
    if (st.status === 'off') this.setState({ sel: i });
    else this.startConnect(i);
  }

  renderVals() {
    const st = this.getS();
    const G = '#2BD576';
    const snow = st.method === 'snow';
    const empty = !snow && !st.hasBridges;
    const full = !snow && st.hasBridges;
    const isOff = st.status === 'off';
    const isConn = st.status === 'connecting';
    const isOn = st.status === 'on';

    const bridges = [
      { name: 'Bridge 7', cc: 'US', country: 'United States', addr: '129.151.27.14:3721', left: 136, top: 14, lblLeft: 120, lblTop: 66, cx: 160, cy: 38 },
      { name: 'Bridge 8', cc: 'AU', country: 'Australia', addr: '209.38.27.7:33539', left: 242, top: 197, lblLeft: 226, lblTop: 252, cx: 265.7, cy: 221 },
      { name: 'Bridge 9', cc: 'DE', country: 'Germany', addr: '203.0.113.45:9001', left: 30, top: 197, lblLeft: 14, lblTop: 252, cx: 54.3, cy: 221 }
    ];
    const cur = bridges[st.sel];

    const base = { pickable: false, decor: false, slot: false, flake: false, hasLabel: false, checked: 'false', aria: '', cc: '', border: '', bg: '', fg: '', shadow: 'none', anim: 'none', name: '', lblLeft: 0, lblTop: 0, lblWeight: '400', lblColor: '', left: 0, top: 0, pick: () => {} };
    let nodes = [];
    if (snow) {
      const pos = [
        { left: 142, top: 20 }, { left: 258, top: 104 }, { left: 227, top: 230 },
        { left: 57, top: 230 }, { left: 26, top: 104 }
      ];
      nodes = pos.map((p, i) => {
        let border = '#1D2522', bg = '#0E1412', fg = '#4A5753', shadow = 'none', anim = 'none';
        if (isConn) {
          border = '#1E3A2C';
          fg = G;
          anim = 'twinkle 1.5s ease-in-out ' + (i * 0.25).toFixed(2) + 's infinite';
        }
        if (isOn) {
          if (i === 2) { border = G; bg = '#10291C'; fg = G; shadow = '0 0 0 5px rgba(43,213,118,0.15)'; }
          else { fg = '#3F6B55'; }
        }
        return Object.assign({}, base, { flake: true, left: p.left, top: p.top, border: border, bg: bg, fg: fg, shadow: shadow, anim: anim });
      });
    } else if (empty) {
      nodes = bridges.map(b => Object.assign({}, base, { slot: true, left: b.left, top: b.top }));
    } else {
      nodes = bridges.map((b, i) => {
        const picked = i === st.sel;
        const hi = picked && (!st.auto || !isOff);
        return Object.assign({}, base, {
          pickable: !st.auto,
          decor: st.auto,
          hasLabel: true,
          name: b.name,
          cc: b.cc,
          left: b.left,
          top: b.top,
          lblLeft: b.lblLeft,
          lblTop: b.lblTop,
          aria: b.name + ', ' + b.country,
          checked: hi ? 'true' : 'false',
          border: hi ? G : (st.auto ? '#1D2522' : '#2A3230'),
          bg: hi ? '#10291C' : '#0E1412',
          fg: hi ? G : (st.auto ? '#6B7771' : '#A9B3AE'),
          shadow: hi ? '0 0 0 5px rgba(43,213,118,0.15)' : 'none',
          lblColor: hi ? '#EAF1EE' : (st.auto ? '#6B7771' : '#8A948F'),
          lblWeight: hi ? '600' : '400',
          pick: () => this.pick(i)
        });
      });
    }

    const mm = String(Math.floor(st.seconds / 60)).padStart(2, '0');
    const ss = String(st.seconds % 60).padStart(2, '0');

    let title = isOff ? 'Not connected' : (isConn ? 'Connecting…' : 'Connected');
    let sub = 'Tap the center to connect';
    if (snow && isConn) sub = 'Finding a volunteer proxy · tap to cancel';
    if (full && isOff && !st.auto) sub = 'Pick a bridge, then tap the center';
    if (full && isConn) sub = 'Via ' + cur.name + ' · tap to cancel';
    if (empty) { title = 'No bridges yet'; sub = 'Add bridge lines to connect this way'; }

    let info = 'Relays through volunteers’ browsers. No bridge needed.';
    if (snow && isConn) info = 'Asking for a volunteer proxy to relay your traffic.';
    if (snow && isOn) info = 'Relayed by a volunteer proxy. It may change on its own.';

    const lit = isConn || isOn;
    return {
      snowChecked: snow ? 'true' : 'false',
      bridgeChecked: snow ? 'false' : 'true',
      segSnowFg: snow ? G : '#6B7771',
      segBridgeFg: snow ? '#6B7771' : G,
      thumbLeft: snow ? 3 : 50,
      glyphOff: !isConn && !isOn,
      pickSnow: () => this.setMethod('snow'),
      pickBridge: () => this.setMethod('bridge'),

      isOn: isOn,
      isConn: isConn,
      notOn: !isOn,
      heroOff: isOff && !empty,
      heroEmpty: empty,
      title: title,
      titleColor: isOn ? G : '#EAF1EE',
      sub: sub,
      time: mm + ':' + ss,

      nodes: nodes,
      showSpokes: full,
      showLineOff: full && isOff && !st.auto,
      showLineLive: (snow && isOn) || (full && !isOff),
      linePath: 'M160 160 L' + (snow ? '244.8 247.7' : (cur.cx + ' ' + cur.cy)),

      showSnowInfo: snow,
      info: info,
      infoIcon: isOff ? '#7D868F' : G,

      showBridgeInfo: full,
      infoName: (isOff && st.auto) ? 'Automatic' : cur.name,
      infoAddr: (isOff && st.auto) ? 'picked when you connect' : cur.addr,
      autoOn: st.auto,
      autoOff: !st.auto,
      autoSub: st.auto ? 'Picks the best bridge, switches if blocked' : 'Off: you choose',
      toggleAuto: () => this.toggleAuto(),

      showEmpty: empty,
      goSettings: () => this.goSettings(),
      heroTap: () => this.heroTap()
    };
  }
}
</script>
</body>
</html>
